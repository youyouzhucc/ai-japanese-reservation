<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 日语电话预约系统</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🍣 AI 日语电话预约</h1>
      <p>填写预约信息，AI 将自动致电餐厅完成日语预约</p>
    </header>

    <form id="reservationForm" class="form">
      <section>
        <h2>餐厅信息</h2>
        <div class="field">
          <label for="restaurant_name">餐厅名称 <span class="required">*</span></label>
          <input type="text" id="restaurant_name" required placeholder="例：銀座 すし 太郎">
        </div>
        <div class="field">
          <label for="restaurant_phone">餐厅电话 <span class="required">*</span></label>
          <input type="tel" id="restaurant_phone" required placeholder="例：+81-3-1234-5678">
        </div>
      </section>

      <section>
        <h2>预约人信息</h2>
        <div class="field">
          <label for="guest_name">预约人姓名</label>
          <input type="text" id="guest_name" required placeholder="中文或英文">
        </div>
        <div class="field">
          <label for="guest_phone">预约人电话 <span class="required">*</span></label>
          <input type="tel" id="guest_phone" required placeholder="含区号，例：+86-138-0000-0000">
        </div>
      </section>

      <section>
        <h2>预约详情</h2>
        <div class="field">
          <label for="reservation_datetime">预约时间 <span class="required">*</span></label>
          <input type="datetime-local" id="reservation_datetime" required step="1800">
          <small>半小时为间隔（如 18:00、18:30）</small>
        </div>
        <div class="row">
          <div class="field">
            <label for="adults">成人人数</label>
            <input type="number" id="adults" value="1" min="1" max="20">
          </div>
          <div class="field">
            <label for="children">儿童人数</label>
            <input type="number" id="children" value="0" min="0" max="20">
          </div>
        </div>
        <div class="field">
          <label for="notes">预约备注</label>
          <textarea id="notes" rows="3" placeholder="特殊需求、忌口等"></textarea>
        </div>
      </section>

      <div class="actions">
        <button type="submit" id="submitBtn">提交预约并支付</button>
      </div>
    </form>

    <div id="result" class="result hidden">
      <h3>预约单据</h3>
      <div id="orderInfo"></div>
      <p id="statusMsg"></p>
      <button id="checkStatusBtn" class="secondary">刷新状态</button>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
