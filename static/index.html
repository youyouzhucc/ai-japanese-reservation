<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>日本餐厅预订服务</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preload" href="/static/images/banner-1.jpg" as="image">
</head>
<body>
  <header class="page-header">
    <div class="banner">
      <div class="banner-track">
        <div class="banner-slide"><img src="/static/images/banner-1.jpg" alt="寿司" loading="eager" width="400" height="267"></div>
        <div class="banner-slide"><img src="/static/images/banner-2.jpg" alt="寿司拼盘" loading="lazy" width="266" height="400"></div>
        <div class="banner-slide"><img src="/static/images/banner-3.jpg" alt="章鱼烧" loading="lazy" width="400" height="267"></div>
        <div class="banner-slide"><img src="/static/images/banner-4.jpg" alt="炸猪排" loading="lazy" width="400" height="267"></div>
      </div>
    </div>
  </header>
  <main class="page-content">
  <div class="container">
    <header class="form-header">
      <div class="form-header-title-row">
        <h1 id="pageTitle">🍣 日本餐厅预订服务</h1>
        <nav class="form-header-nav">
          <a href="#" id="myAccountLink" class="form-header-nav-link" data-href="/my-account" onclick="return window.checkAuthNav(event, this)"><span class="nav-icon" aria-hidden="true">👤</span><span id="navNickname">我的账号</span></a>
          <a href="#" id="myReservationsLink" class="form-header-nav-link" data-href="/my-reservations" onclick="return window.checkAuthNav(event, this)"><span class="nav-icon" aria-hidden="true">📅</span>我的预约</a>
        </nav>
      </div>
      <p id="pageSubtitle">填写预约信息，AI 将自动致电餐厅完成日语预约</p>
    </header>

    <form id="reservationForm" class="form">
      <section>
        <h2 data-i18n="restaurant">餐厅信息</h2>
        <div class="field restaurant-search-field">
          <div class="label-row"><label for="restaurant_search" data-i18n="restaurantSearch">搜索餐厅</label></div>
          <div class="restaurant-search-wrap">
            <input type="text" id="restaurant_search" data-placeholder="restaurantSearchPlaceholder" autocomplete="off">
            <button type="button" class="search-btn" id="restaurantSearchBtn" aria-label="搜索">🔍</button>
          </div>
          <div id="restaurantSearchResults" class="search-results hidden"></div>
        </div>
        <div class="field">
          <div class="label-row"><label for="restaurant_name" data-i18n="restaurantName">餐厅名称</label><span class="required">*</span></div>
          <input type="text" id="restaurant_name" required data-placeholder="exampleRestaurant">
        </div>
        <div class="field">
          <div class="label-row"><label for="restaurant_phone" data-i18n="restaurantPhone">餐厅电话</label><span class="required">*</span></div>
          <input type="tel" id="restaurant_phone" required placeholder="13800000000（测试可填自己的手机号）" data-placeholder="examplePhone">
        </div>
      </section>

      <section>
        <h2 data-i18n="reservation">预约信息</h2>
        <div class="field">
          <div class="label-row"><label for="guest_name" data-i18n="guestName">预约人姓名</label><span class="required">*</span></div>
          <input type="text" id="guest_name" required data-placeholder="exampleGuest">
        </div>
        <div class="field">
          <div class="label-row"><label data-i18n="guestPhone">预约人电话</label><span class="required">*</span></div>
          <div class="row phone-row">
            <div class="phone-input-group phone-prefix-group">
              <label for="guest_phone_prefix" data-i18n="areaCode">区号</label>
              <select id="guest_phone_prefix" required></select>
            </div>
            <div class="phone-input-group phone-number-group">
              <label for="guest_phone_number" data-i18n="phoneNumber">号码</label>
              <input type="tel" id="guest_phone_number" required placeholder="138-0000-0000">
            </div>
          </div>
        </div>
      </section>

      <section>
        <h2 data-i18n="reservationDetail">预约详情</h2>
        <div class="field field-datetime-row">
          <div class="label-row"><label data-i18n="firstPreference">第一希望预约日期、时间</label><span class="required">*</span></div>
          <div class="datetime-inputs">
            <div class="date-picker-wrap" id="openDatePicker">
              <input type="text" id="reservation_date" required readonly data-placeholder="datePlaceholder">
              <span class="date-icon">📅</span>
            </div>
            <div class="time-input-wrap" id="reservationTimeWrap">
              <select id="reservation_hour" required>
                <option value="">时</option>
              </select>
              <span class="time-sep">:</span>
              <select id="reservation_minute" required>
                <option value="">分</option>
                <option value="00">00</option>
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="30">30</option>
                <option value="40">40</option>
                <option value="50">50</option>
              </select>
            </div>
          </div>
        </div>
        <div class="field field-datetime-row">
          <div class="label-row"><label data-i18n="secondPreference">第二希望预约日期、时间</label></div>
          <div class="datetime-inputs">
            <div class="date-picker-wrap" id="openDatePicker2">
              <input type="text" id="second_date" readonly data-placeholder="datePlaceholder">
              <span class="date-icon">📅</span>
            </div>
            <div class="time-input-wrap">
              <select id="second_hour">
                <option value="">时</option>
              </select>
              <span class="time-sep">:</span>
              <select id="second_minute">
                <option value="">分</option>
                <option value="00">00</option>
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="30">30</option>
                <option value="40">40</option>
                <option value="50">50</option>
              </select>
            </div>
          </div>
        </div>
        <div id="datePickerPopup" class="date-picker-popup hidden">
          <div class="date-picker-header">
            <button type="button" class="date-nav" id="prevMonth">‹</button>
            <span id="datePickerMonth">2025年1月</span>
            <button type="button" class="date-nav" id="nextMonth">›</button>
          </div>
          <div class="date-picker-weekdays">
            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
          </div>
          <div id="datePickerDays" class="date-picker-days"></div>
        </div>
        <div class="row">
          <div class="field">
            <div class="label-row"><label for="adults" data-i18n="adults">成人人数</label><span class="required">*</span></div>
            <input type="number" id="adults" value="1" min="1" max="20" required>
          </div>
          <div class="field">
            <div class="label-row"><label for="children" data-i18n="children">儿童人数</label><span class="required">*</span></div>
            <input type="number" id="children" value="0" min="0" max="20" required>
          </div>
        </div>
        <div class="field">
          <label for="dietary_notes" data-i18n="dietaryNotes">饮食注意（请详细填写过敏食材、忌口、宗教饮食限制等）</label>
          <textarea id="dietary_notes" rows="3" data-placeholder="dietaryPlaceholder"></textarea>
        </div>
        <div class="field">
          <label for="notes" data-i18n="notes">预约备注</label>
          <textarea id="notes" rows="2" data-placeholder="notesPlaceholder"></textarea>
        </div>
      </section>

      <div class="actions">
        <button type="submit" id="submitBtn" data-i18n="submit" onclick="return window.checkAuthSubmit(event)">提交预约</button>
      </div>
    </form>

    <!-- 步骤2：预约确认页 -->
    <div id="stepConfirm" class="step-page hidden">
      <h3>确认预约信息</h3>
      <div id="confirmInfo" class="confirm-card"></div>
      <div class="step-actions">
        <button type="button" id="confirmBackBtn" class="step-btn-secondary">← 返回修改</button>
        <button type="button" id="confirmPayBtn" class="step-btn-primary">去支付（¥1）</button>
      </div>
    </div>

    <!-- 步骤3：支付二维码页 -->
    <div id="stepPayQr" class="step-page hidden">
      <h3>扫码支付</h3>
      <div id="payQrInfo" class="confirm-card"></div>
      <div id="payQrArea" class="qr-area"></div>
      <p id="payQrHint" class="step-hint">请使用支付宝扫码支付，支付完成后点击下方按钮</p>
      <div class="step-actions">
        <button type="button" id="payQrBackBtn" class="step-btn-secondary">← 返回预约</button>
        <button type="button" id="payQrCheckBtn" class="step-btn-primary">我已支付，查看结果</button>
      </div>
    </div>

    <!-- 步骤4：支付成功/预约中页 -->
    <div id="stepSuccess" class="step-page hidden">
      <div id="successIcon" class="success-icon">✅</div>
      <h3 id="successTitle">预约提交成功</h3>
      <p id="successMsg" class="step-hint"></p>
      <div id="successInfo" class="confirm-card"></div>
      <div class="step-actions">
        <button type="button" id="successBackBtn" class="step-btn-primary">返回预约页面</button>
        <button type="button" id="successRefreshBtn" class="step-btn-secondary hidden">刷新状态</button>
      </div>
    </div>
  </div>
  </main>

  <!-- 登录/注册弹窗 -->
  <div id="loginModal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content login-modal-content">
      <h3>手机号登录 / 注册</h3>
      <p class="modal-hint">预约前请先登录，新用户验证手机号即完成注册</p>
      <div class="field">
        <label for="login_phone">手机号（含区号）</label>
        <input type="tel" id="login_phone" placeholder="+86 138 0000 0000" class="login-input">
      </div>
      <div class="field">
        <label for="login_code">验证码</label>
        <div class="code-row">
          <input type="text" id="login_code" placeholder="6位验证码" maxlength="6" class="login-input">
          <button type="button" id="sendCodeBtn" class="code-btn">获取验证码</button>
        </div>
      </div>
      <div class="modal-actions login-modal-actions">
        <button type="button" id="loginModalCloseBtn" class="login-close-btn">关闭</button>
        <button type="button" id="loginSubmitBtn" class="login-submit-btn">登录</button>
      </div>
    </div>
  </div>

  <script src="/static/i18n.js" defer></script>
  <script src="/static/app.js?v=7" defer></script>
</body>
</html>
